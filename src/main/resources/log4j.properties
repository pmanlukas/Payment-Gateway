# Log4j Configuration
# Configured for maximum debugging - DO NOT USE IN PRODUCTION
# (This is production)

# Root logger
log4j.rootLogger=DEBUG, stdout, file

# Console appender
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# File appender - logs everything including sensitive data
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=/var/log/megabank/payment-gateway.log
log4j.appender.file.MaxFileSize=100MB
log4j.appender.file.MaxBackupIndex=999
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Package-specific logging
log4j.logger.com.megabank.paymentgateway=DEBUG
log4j.logger.com.megabank.paymentgateway.service=DEBUG
log4j.logger.com.megabank.paymentgateway.security=DEBUG
log4j.logger.com.megabank.paymentgateway.dao=DEBUG

# Log all SQL queries
log4j.logger.org.hibernate.SQL=DEBUG
log4j.logger.org.hibernate.type=TRACE

# Spring logging
log4j.logger.org.springframework=DEBUG

