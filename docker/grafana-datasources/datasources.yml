apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: payments
    user: payment_admin
    secureJsonData:
      password: Payment123!
    editable: true
    jsonData:
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
