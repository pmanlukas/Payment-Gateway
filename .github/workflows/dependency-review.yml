name: Dependency Review

on:
  pull_request:
    paths:
      - 'pom.xml'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        # Allow known vulnerabilities in this legacy codebase
        allow-licenses: MIT, Apache-2.0, BSD-3-Clause, LGPL-2.1
      continue-on-error: true  # Don't fail - legacy dependencies have many vulnerabilities

    - name: Check for dependency changes
      run: |
        echo "## Dependency Changes" > dependency-changes.md
        echo "" >> dependency-changes.md

        # Check if pom.xml was modified
        if git diff origin/main...HEAD --name-only | grep -q "pom.xml"; then
          echo "⚠️  pom.xml has been modified in this PR" >> dependency-changes.md
          echo "" >> dependency-changes.md

          echo "### Changed Dependencies:" >> dependency-changes.md
          echo '```xml' >> dependency-changes.md
          git diff origin/main...HEAD pom.xml | grep -E '^\+.*<dependency>|^\+.*<version>|^-.*<dependency>|^-.*<version>' || echo "No dependency changes detected" >> dependency-changes.md
          echo '```' >> dependency-changes.md
          echo "" >> dependency-changes.md

          echo "### ⚠️  Warning" >> dependency-changes.md
          echo "This legacy system uses very old dependencies:" >> dependency-changes.md
          echo "- Java 1.6" >> dependency-changes.md
          echo "- Spring 3.2.18" >> dependency-changes.md
          echo "- Hibernate 3.6.10" >> dependency-changes.md
          echo "- MySQL Connector 5.1.6" >> dependency-changes.md
          echo "" >> dependency-changes.md
          echo "**Upgrading dependencies may break compatibility with:**" >> dependency-changes.md
          echo "- Legacy COBOL mainframe integration" >> dependency-changes.md
          echo "- Nightly batch processing" >> dependency-changes.md
          echo "- Serialized Transaction objects" >> dependency-changes.md
          echo "" >> dependency-changes.md
          echo "Please test thoroughly before merging!" >> dependency-changes.md
        else
          echo "No dependency changes in this PR" >> dependency-changes.md
        fi

        cat dependency-changes.md

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('dependency-changes.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
