name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn clean compile -B

    - name: Run tests
      run: mvn test -B
      # Note: Tests are currently disabled in pom.xml (surefire plugin commented out)
      # This will need to be uncommented for tests to actually run
      continue-on-error: true  # Allow pipeline to continue even if tests fail (legacy code!)

    - name: Generate test report
      if: always()
      uses: dorny/test-reporter@v2
      continue-on-error: true  # Don't fail if no test reports exist
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false

    - name: Package application
      run: mvn package -DskipTests -B

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: payment-gateway-jar
        path: target/*.jar
        retention-days: 30

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Run code quality checks
      run: |
        echo "Running code quality analysis..."
        # Note: SpotBugs, PMD, or Checkstyle could be added here
        # Currently not configured in pom.xml

    - name: Check for hardcoded secrets
      run: |
        echo "Scanning for hardcoded credentials..."
        # This is ironic since the codebase is FULL of hardcoded secrets
        grep -r "password.*=.*\"" src/ || echo "No passwords found (yeah right)"
        grep -r "api.*key.*=.*\"" src/ || echo "No API keys found (sure)"

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Run OWASP Dependency Check
      run: |
        # Download OWASP Dependency Check CLI
        wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
        unzip -q dependency-check-9.0.9-release.zip

        # Run dependency check
        ./dependency-check/bin/dependency-check.sh \
          --project "MegaBank Payment Gateway" \
          --scan . \
          --format HTML \
          --format JSON \
          --out ./dependency-check-report \
          --suppression ./dependency-check-suppression.xml \
          || true  # Don't fail the build (legacy dependencies have MANY CVEs)

    - name: Upload dependency check report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: dependency-check-report/
        retention-days: 30

    - name: Comment PR with vulnerability summary
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('./dependency-check-report/dependency-check-report.json', 'utf8'));
            const vulnerabilities = report.dependencies.reduce((sum, dep) =>
              sum + (dep.vulnerabilities ? dep.vulnerabilities.length : 0), 0
            );

            const comment = `## 🔍 Dependency Vulnerability Scan Results

            - **Total Dependencies Scanned**: ${report.dependencies.length}
            - **Vulnerabilities Found**: ${vulnerabilities}

            ⚠️ **Note**: This legacy codebase uses outdated dependencies (Java 6, Spring 3.2, Hibernate 3.6).
            Many vulnerabilities are expected. See full report in artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse dependency check report:', error.message);
          }
