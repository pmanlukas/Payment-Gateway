name: Security Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scan every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  secret-scanning:
    name: Scan for Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better secret detection

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true  # Don't fail - this codebase is FULL of secrets by design

    - name: Custom secret pattern scan
      run: |
        echo "## Security Scan Results" > security-report.md
        echo "" >> security-report.md
        echo "### Hardcoded Credentials Found:" >> security-report.md
        echo "" >> security-report.md

        # Database passwords
        echo "#### Database Passwords" >> security-report.md
        grep -rn "DB_PASSWORD.*=.*\"" src/ >> security-report.md || echo "None found" >> security-report.md
        echo "" >> security-report.md

        # API Keys
        echo "#### API Keys" >> security-report.md
        grep -rn "API_KEY.*=.*\"" src/ >> security-report.md || echo "None found" >> security-report.md
        echo "" >> security-report.md

        # Encryption Keys
        echo "#### Encryption Keys" >> security-report.md
        grep -rn "ENCRYPTION_KEY.*=.*\"" src/ >> security-report.md || echo "None found" >> security-report.md
        echo "" >> security-report.md

        # SMTP/FTP Passwords
        echo "#### SMTP/FTP Passwords" >> security-report.md
        grep -rn "smtp.password\|ftp.password" src/ >> security-report.md || echo "None found" >> security-report.md
        echo "" >> security-report.md

        cat security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-report
        path: security-report.md
        retention-days: 90

  sql-injection-scan:
    name: Static Analysis - SQL Injection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Scan for SQL injection patterns
      run: |
        echo "## SQL Injection Vulnerability Scan" > sql-injection-report.md
        echo "" >> sql-injection-report.md
        echo "Scanning for dangerous SQL patterns..." >> sql-injection-report.md
        echo "" >> sql-injection-report.md

        # String concatenation in SQL
        echo "### String concatenation in SQL queries:" >> sql-injection-report.md
        grep -rn "\"SELECT.*+\|\"INSERT.*+\|\"UPDATE.*+\|\"DELETE.*+" src/ >> sql-injection-report.md || echo "None found" >> sql-injection-report.md
        echo "" >> sql-injection-report.md

        # Statement.executeQuery with concatenation
        echo "### Direct executeQuery/executeUpdate calls:" >> sql-injection-report.md
        grep -rn "executeQuery\|executeUpdate" src/ >> sql-injection-report.md || echo "None found" >> sql-injection-report.md
        echo "" >> sql-injection-report.md

        # Missing PreparedStatement usage
        echo "### PreparedStatement usage (should be used instead):" >> sql-injection-report.md
        grep -rn "PreparedStatement" src/ >> sql-injection-report.md || echo "⚠️  NO PreparedStatements found - all queries vulnerable!" >> sql-injection-report.md

        cat sql-injection-report.md

    - name: Upload SQL injection report
      uses: actions/upload-artifact@v4
      with:
        name: sql-injection-scan-report
        path: sql-injection-report.md
        retention-days: 90

  pci-compliance-check:
    name: PCI-DSS Compliance Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Scan for PCI violations
      run: |
        echo "## PCI-DSS Compliance Scan Report" > pci-compliance-report.md
        echo "" >> pci-compliance-report.md
        echo "### Critical Violations:" >> pci-compliance-report.md
        echo "" >> pci-compliance-report.md

        # CVV storage
        echo "#### CVV Storage (PCI-DSS 3.2 Violation):" >> pci-compliance-report.md
        echo "❌ CVV must NEVER be stored after authorization" >> pci-compliance-report.md
        grep -rn "\.cvv\|CVV\|card.*verification" src/ | head -20 >> pci-compliance-report.md
        echo "" >> pci-compliance-report.md

        # Full card number storage
        echo "#### Full Card Number References:" >> pci-compliance-report.md
        grep -rn "cardNumber\|card_number" src/ | head -20 >> pci-compliance-report.md
        echo "" >> pci-compliance-report.md

        # Plain text passwords
        echo "#### Password Storage:" >> pci-compliance-report.md
        grep -rn "password.*=.*getString\|setPassword" src/ | head -20 >> pci-compliance-report.md
        echo "" >> pci-compliance-report.md

        # SSN storage
        echo "#### SSN Storage:" >> pci-compliance-report.md
        grep -rn "\.ssn\|SSN" src/ | head -20 >> pci-compliance-report.md
        echo "" >> pci-compliance-report.md

        # Logging sensitive data
        echo "#### Sensitive Data in Logs:" >> pci-compliance-report.md
        grep -rn "System.out.println.*card\|println.*password\|println.*cvv" src/ | head -20 >> pci-compliance-report.md

        cat pci-compliance-report.md

    - name: Upload PCI compliance report
      uses: actions/upload-artifact@v4
      with:
        name: pci-compliance-report
        path: pci-compliance-report.md
        retention-days: 90

    - name: Comment on PR with PCI violations
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('pci-compliance-report.md', 'utf8');

          const comment = `## 🔒 PCI-DSS Compliance Scan

          ⚠️ **This codebase has critical PCI-DSS violations**

          <details>
          <summary>View detailed report</summary>

          ${report}

          </details>

          **Action Required**: See issues #9 (CVV Removal) for remediation plan.
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java
        queries: security-and-quality

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build for CodeQL
      run: mvn clean compile -B -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java"
